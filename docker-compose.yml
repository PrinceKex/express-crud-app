version: '3.8'

services:
 frontend:
  build:
   context: ./frontend
   dockerfile: Dockerfile
  ports:
   - '8080:80'
  depends_on:
   - backend
  environment:
   - VUE_APP_API_URL=http://backend:3000
  networks:
   - app-network

 backend:
  build:
   context: ./backend
   dockerfile: Dockerfile
  ports:
   - '3000:3000'
  environment:
   - DATABASE_URL=postgresql://postgres:postgres@db:5432/crud_app
   - JWT_SECRET=your_jwt_secret_key
  depends_on:
   - db
  networks:
   - app-network

 db:
  image: postgres:15
  ports:
   - '5432:5432'
  environment:
   - POSTGRES_USER=postgres
   - POSTGRES_PASSWORD=postgres
   - POSTGRES_DB=crud_app
  volumes:
   - postgres_data:/var/lib/postgresql/data
  networks:
   - app-network

networks:
 app-network:
  driver: bridge

volumes:
 postgres_data:
